<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CreatorToolbox AI</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>CreatorToolbox</h1>
      <p>AI tools for creators</p>
    </header>

    <section class="card">

      <label for="tool">Choose Tool</label>

      <select id="tool">
        <option value="general">General AI</option>
        <option value="script">Script Generator</option>
        <option value="hooks">Hook Generator</option>
        <option value="caption">Caption Generator</option>
        <option value="hashtags">Hashtag Generator</option>
        <option value="reel">Reel Ideas</option>
      </select>


      <label for="prompt">Your Prompt</label>

      <textarea
        id="prompt"
        placeholder="Example: Create a 30-second Instagram Reel script about discipline in Hinglish..."
      ></textarea>


      <button id="generateBtn">
        Generate
      </button>


      <div id="status" class="status"></div>


      <div class="result-container">

        <div class="result-header">
          <h2>Result</h2>
          <span id="provider"></span>
        </div>

        <div id="result">
          Your AI-generated content will appear here.
        </div>

      </div>

    </section>

  </main>


  <script>

    const generateBtn = document.getElementById("generateBtn");
    const promptInput = document.getElementById("prompt");
    const toolSelect = document.getElementById("tool");

    const resultBox = document.getElementById("result");
    const statusBox = document.getElementById("status");
    const providerBox = document.getElementById("provider");


    generateBtn.addEventListener("click", async () => {

      const prompt = promptInput.value.trim();
      const tool = toolSelect.value;


      if (!prompt) {
        statusBox.textContent = "Please enter a prompt.";
        return;
      }


      generateBtn.disabled = true;
      generateBtn.textContent = "Generating...";

      statusBox.textContent = "AI is generating your content...";
      providerBox.textContent = "";

      resultBox.textContent = "";


      try {

        const response = await fetch("/api/generate", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            prompt: prompt,
            tool: tool
          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.error || "Something went wrong."
          );

        }


        resultBox.textContent = data.result;


        if (data.provider === "gemini") {

          providerBox.textContent = "Generated by Gemini";

        } else if (data.provider === "huggingface") {

          providerBox.textContent =
            "Generated by Hugging Face";

        }


        statusBox.textContent = "Generation complete.";

      } catch (error) {

        console.error(error);

        statusBox.textContent =
          "Generation failed.";

        resultBox.textContent =
          error.message || "Something went wrong.";

      } finally {

        generateBtn.disabled = false;
        generateBtn.textContent = "Generate";

      }

    });

  </script>

</body>
  </html>
